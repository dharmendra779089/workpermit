services:
  - type: web
    name: opmaint-ptw-cmms
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: opmaint-ptw-postgres
          property: connectionString

databases:
  - name: opmaint-ptw-postgres
    databaseName: opmaint_ptw
    user: opmaint_user
    plan: free
